name: Antigravity artifact

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/antigravity.yaml"
      - "Dockerfile"
      - "antigravity-proxy.js"
      - "ci/patch-antigravity-extension.sh"
      - "ci/reconcile-antigravity-metadata.js"
      - "ci/sync-antigravity-extension.sh"
      - "ci/test-antigravity-extension.sh"
      - "railway-entrypoint.sh"
  pull_request:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/antigravity.yaml"
      - "Dockerfile"
      - "antigravity-proxy.js"
      - "ci/patch-antigravity-extension.sh"
      - "ci/reconcile-antigravity-metadata.js"
      - "ci/sync-antigravity-extension.sh"
      - "ci/test-antigravity-extension.sh"
      - "railway-entrypoint.sh"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify pinned Antigravity artifact
    runs-on: ubuntu-latest
    container:
      image: codercom/code-server:4.134.0
      options: --user root
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install verification utilities
        run: apt-get update && apt-get install -y --no-install-recommends bash curl jq nodejs unzip

      # This intentionally fails if the exact reviewed Marketplace artifact is
      # no longer available: the production Docker build depends on it too.
      - name: Verify official VSIX and compatibility hook
        run: ./ci/test-antigravity-extension.sh
